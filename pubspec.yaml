name: serverpod_dev_tools
description: Unified developer tools suite for Serverpod applications (ER Schema Visualizer, Live DB Inspector, Endpoint Explorer & Caller, and Mock Data Generator).
version: 0.1.0
homepage: https://github.com/josealba/serverpod_dev_tools
repository: https://github.com/josealba/serverpod_dev_tools
issue_tracker: https://github.com/josealba/serverpod_dev_tools/issues

screenshots:
  - description: 'Interactive ER Database Schema Visualizer with Crow foot relationship mapping'
    path: doc/screenshots/01_schema_canvas.png
  - description: 'Live PostgreSQL Database Table Inspector with paginated DataGrid'
    path: doc/screenshots/02_inspect_data.png
  - description: 'Server Connection Settings with Dual-Mode toggle between VM Service and WebServer HTTP REST'
    path: doc/screenshots/03_server_connection_settings.png
  - description: 'Serverpod Endpoint Caller and typed method parameter explorer'
    path: doc/screenshots/04_endpoint_caller.png
  - description: 'Live Request Execution and Real-time Response Console'
    path: doc/screenshots/05_execute_request.png
  - description: 'Integrated Workspace HTTP File Suite and saved request collections'
    path: doc/screenshots/06_http_workspace.png


environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  meta: ^1.15.0
  path: ^1.9.0
  postgres: ^3.5.17
  serverpod: ^4.0.2
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.1

